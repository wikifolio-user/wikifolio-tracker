[client]
# Blendet das "Running ..." / "Manage app"-Statuskaestchen aus, das Streamlit
# sonst waehrend jedes Reruns oben rechts einblendet. Wir zeigen stattdessen
# den eigenen zentrierten Ladefortschritt in der App.
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "dark"
backgroundColor = "#0A0B0D"
secondaryBackgroundColor = "#131519"
textColor = "#E9EBEF"
# primaryColor faerbt in Streamlit u.a. Fokusrahmen von Eingabefeldern und
# Dropdowns. Bewusst Weiss statt Gruen: Gruen/Rot sind in dieser App fuer
# Kursveraenderungen reserviert - ein gruener Fokusrahmen wuerde dort faelschlich
# nach "Gewinn" aussehen. Bedienelemente heben sich stattdessen ueber Weiss ab.
primaryColor = "#FFFFFF"
