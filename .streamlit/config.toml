[client]
# Blendet das "Running ..." / "Manage app"-Statuskaestchen aus, das Streamlit
# sonst waehrend jedes Reruns oben rechts einblendet. Wir zeigen stattdessen
# den eigenen zentrierten Ladefortschritt in der App.
toolbarMode = "minimal"
# Keine Tracebacks/Details im Browser (Audit SEC-09) - Fehler landen nur im Server-Log.
showErrorDetails = false

[theme]
base = "dark"
# Blau-Design (10/2026): Navy-Grund, blaue Akzente. Gruen/Rot bleiben fuer
# Kursveraenderungen reserviert - Blau als Bedienfarbe kollidiert damit nicht.
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#0E1826"
textColor = "#E8EEF6"
primaryColor = "#5B9BFF"
linkColor = "#8AB8FF"
borderColor = "#24364F"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "12px"
