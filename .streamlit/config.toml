[client]
# Blendet das "Running ..." / "Manage app"-Statuskaestchen aus, das Streamlit
# sonst waehrend jedes Reruns oben rechts einblendet. Wir zeigen stattdessen
# den eigenen zentrierten Ladefortschritt in der App.
toolbarMode = "minimal"
# Keine Tracebacks/Details im Browser (Audit SEC-09) - Fehler landen nur im Server-Log.
showErrorDetails = false

[theme]
base = "dark"
# Apple-Graphit (Liquid Glass, 10/2026): neutrale Grautoene, Systemblau als Bedienfarbe.
# Gruen/Rot bleiben fuer Kursveraenderungen reserviert.
backgroundColor = "#111113"
secondaryBackgroundColor = "#1C1C1E"
textColor = "#F5F5F7"
primaryColor = "#0A84FF"
linkColor = "#409CFF"
borderColor = "#38383A"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "12px"
