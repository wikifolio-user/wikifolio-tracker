[client]
# Blendet das "Running ..." / "Manage app"-Statuskaestchen aus, das Streamlit
# sonst waehrend jedes Reruns oben rechts einblendet. Wir zeigen stattdessen
# den eigenen zentrierten Ladefortschritt in der App.
toolbarMode = "minimal"
# Keine Tracebacks/Details im Browser (Audit SEC-09) - Fehler landen nur im Server-Log.
showErrorDetails = false

[theme]
base = "dark"
# Premium Glass (10/2026): tiefes Navy, Akzent Periwinkle #7c9cff (zweiter Akzent Tuerkis #5eead4 nur im CSS).
# Gruen/Rot (#34d399 / #f87171) bleiben fuer Gewinne/Verluste reserviert.
primaryColor = "#7c9cff"
backgroundColor = "#07090f"
secondaryBackgroundColor = "#0d1220"
textColor = "#e8ecf6"
linkColor = "#a5b8ff"
borderColor = "#232a3d"
font = "sans serif"
showWidgetBorder = true
baseRadius = "14px"
buttonRadius = "14px"
