name: LS9VFS Kurs-Alarm (5 Min)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-alert
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Repo (Skript) auschecken
        uses: actions/checkout@v4
        with:
          path: repo

      - name: State-Branch auschecken
        uses: actions/checkout@v4
        with:
          ref: bot-state
          path: state

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Kurs prüfen und ggf. Discord informieren
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PRICE_ALERT_STATE_FILE: ${{ github.workspace }}/state/price_alert_state.json
        run: python repo/discord_price_alert.py

      - name: State zurückschreiben
        working-directory: state
        run: |
          git config user.name "price-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price_alert_state.json
          git diff --cached --quiet || git commit -m "update price alert state [skip ci]"
          git push
