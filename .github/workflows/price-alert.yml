name: LS9VFS Kurs-Alarm (5 Min)

on:
  # FALLBACK: laeuft weiter, falls der externe Pinger (siehe unten) mal
  # ausfaellt - GitHub deprioritisiert schedule-Trigger aber generell
  # gegenueber Event-Triggern, deshalb kommt repository_dispatch als
  # PRIMAERER Ausloeser dazu. Intervall hier bewusst auf 15 Min gesenkt,
  # da es ohnehin nur als Sicherheitsnetz dient - der Pinger deckt die
  # eigentlichen 5-Minuten-Laeufe ab, doppeltes *-/5-Polling waere unnoetig.
  schedule:
    - cron: "*/15 * * * *"

  # PRIMAERER Ausloeser: ein externer Cron-Dienst (z.B. cron-job.org) ruft
  # alle 5 Minuten die GitHub-API auf und loest damit dieses Event aus.
  # Event-getriggerte Workflows werden von GitHub NICHT deprioritisiert -
  # das ist der eigentliche Fix fuer die unzuverlaessigen Lauf-Abstaende.
  # "event_type" muss exakt zum Payload passen, den der externe Dienst sendet.
  repository_dispatch:
    types: [price-check]

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-alert
  # WICHTIG bei zwei Ausloesern: verhindert, dass ein schedule-Fallback-Lauf
  # und ein Pinger-Lauf sich gegenseitig ueberlappen und denselben State
  # gleichzeitig schreiben. Laeuft bereits einer, wird der naechste nicht
  # abgebrochen, sondern wartet - kein verlorener Lauf, nur serialisiert.
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests tzdata

      - name: Kurs prüfen und ggf. Discord informieren
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: python discord_price_alert.py
