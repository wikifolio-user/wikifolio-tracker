name: LS9VFS Kurs-Alarm (5 Min)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-alert
  # WICHTIG bei zwei Ausloesern: verhindert, dass ein schedule-Fallback-Lauf
  # und ein Pinger-Lauf sich gegenseitig ueberlappen und denselben State
  # gleichzeitig schreiben. Laeuft bereits einer, wird der naechste nicht
  # abgebrochen, sondern wartet - kein verlorener Lauf, nur serialisiert.
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests tzdata

      - name: Kurs prüfen und ggf. Discord informieren
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: python discord_price_alert.py
