name: Wikifolio Automation Runner

on:
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Paket-Installation
        run: pip install -r requirements.txt
      - name: Trade Check
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python automation.py trade
      - name: Daily Report (nur um 20:00 UTC)
        if: github.event.schedule == '0 20 * * 1-5'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python automation.py daily
      - name: Status speichern
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_state.json || exit 0
          git commit -m "State update" || exit 0
          git push
