name: Wiki-Idee Umschichtung (freitags)

# Neuer, eigenstaendiger Workflow: schichtet das Modelldepot der Wiki-Idee (50 Aktien + 20 ETFs) um und
# schreibt nur state/wiki_idee/... auf den State-Branch. Danach eine Mail mit den Anpassungen, sofern die
# Secrets MAIL_ABSENDER, MAIL_APP_PASSWORT und MAIL_EMPFAENGER hinterlegt sind. Preisalarme und die
# anderen Agenten bleiben unberuehrt.
on:
  # Freitag 17:17 UTC = 18:17 Uhr (Winterzeit) bzw. 19:17 Uhr (Sommerzeit) Berlin - nach Xetra-Schluss,
  # Kurse von ls-tc.de (Handel bis 23 Uhr)
  schedule:
    - cron: "17 17 * * 5"
  # Manuell startbar: Actions -> "Wiki-Idee Umschichtung (freitags)" -> Run workflow (z. B. fuer den Start)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wiki-idee
  cancel-in-progress: false

jobs:
  umschichten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests==2.34.2 tzdata==2026.5 pandas==3.0.5 numpy==2.5.3 yfinance==1.7.0 beautifulsoup4==4.15.0   # wie requirements.txt

      - name: Modelldepot umschichten und Mail senden
        env:
          GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_ABSENDER: ${{ secrets.MAIL_ABSENDER }}
          MAIL_APP_PASSWORT: ${{ secrets.MAIL_APP_PASSWORT }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
        run: python wiki_idee_agent.py
