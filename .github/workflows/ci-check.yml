name: Syntax- und Rechen-Check (CI)

# Prueft bei jedem Push/PR:
# 1. ob alle .py-Dateien gueltiges Python sind (faengt IndentationError & Co.
#    VOR dem Deploy auf Streamlit Cloud ab),
# 2. ob alle Unit-Tests (test_*.py) gruen sind - Finanzformeln, Speicher,
#    Login, Alarme, Agenten. Die Tests laufen ohne Netz und ohne Streamlit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true          # bei schnell aufeinanderfolgenden Pushes nur den letzten pruefen

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Alle .py-Dateien auf gueltige Syntax pruefen
        run: |
          set -e
          find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 -n1 python -m py_compile
          echo "✅ Alle Python-Dateien sind syntaktisch gueltig."

      - name: Abhaengigkeiten fuer die Tests installieren
        run: pip install requests pandas numpy tzdata

      - name: Unit-Tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -p "test_*.py" -v
