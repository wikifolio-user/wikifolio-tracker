name: Syntax- und Rechen-Check (CI)

# Prueft bei jedem Push/PR:
# 1. ob alle .py-Dateien gueltiges Python sind (faengt IndentationError & Co.
#    VOR dem Deploy auf Streamlit Cloud ab),
# 2. ob alle Unit-Tests (test_*.py) gruen sind - Finanzformeln, Speicher,
#    Login, Alarme, Agenten. Die Tests laufen ohne Netz und ohne Streamlit,
# 3. ob die App startet und jede Ansicht des Menues ohne Ausnahme rendert
#    (test_ui_rauch.py, mit Streamlit und Testdaten, ohne Netz).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true          # bei schnell aufeinanderfolgenden Pushes nur den letzten pruefen

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Alle .py-Dateien auf gueltige Syntax pruefen
        run: |
          set -e
          find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 -n1 python -m py_compile
          echo "✅ Alle Python-Dateien sind syntaktisch gueltig."

      - name: Abhaengigkeiten fuer die Tests installieren
        run: pip install requests==2.34.2 pandas==3.0.5 numpy==2.5.3 tzdata==2026.5 reportlab==5.0.1   # wie requirements.txt

      - name: Unit-Tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -p "test_*.py" -v

      # Oberflaeche (Audit QA-01): die ganze App mit Testdaten ohne Netz starten und JEDE Ansicht des Menues
      # einmal oeffnen - eine Ausnahme in irgendeiner Ansicht laesst den Lauf scheitern. Braucht Streamlit und
      # Plotly, deshalb erst hier die vollstaendigen Abhaengigkeiten (die Rechen-Tests oben laufen ohne).
      - name: Alle Abhaengigkeiten installieren (Streamlit, Plotly)
        run: pip install -r requirements.txt

      - name: Oberflaeche - jede Ansicht einmal oeffnen
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # timeout: eine haengende Ansicht soll den Lauf nach 10 Minuten rot machen statt ihn zu blockieren
        run: timeout 600 python -m unittest test_ui_rauch -v
