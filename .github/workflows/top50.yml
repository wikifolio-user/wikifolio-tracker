name: Watchlist Top 50 (täglich)

on:
  # Täglich 05:30 UTC = 07:30 Uhr deutscher Sommerzeit (06:30 im Winter) -
  # vor Handelsbeginn, die Schlusskurse des Vortags liegen dann vollständig vor.
  schedule:
    - cron: "30 5 * * *"
  # Manuell startbar: Actions -> "Watchlist Top 50 (täglich)" -> Run workflow
  workflow_dispatch: {}

permissions:
  contents: write

# Nie gleichzeitig mit dem Qualitaets-Agenten (Yahoo-Drossel): ein neuer Lauf
# wartet, statt den laufenden abzubrechen. ACHTUNG: GitHub haelt je Gruppe nur
# EINEN wartenden Lauf - ein weiterer verdraengt ihn (Status "cancelled"), es
# kann also ein Lauf ausfallen; der naechste taegliche Lauf holt ihn nach.
concurrency:
  group: yahoo-abrufe
  cancel-in-progress: false

jobs:
  ranglisten:
    runs-on: ubuntu-latest
    # Großzügig bemessen: die wöchentliche wikifolio-Suche plus mehrere
    # tausend Kursabrufe mit bewusst gedrosselter Rate dauern ihre Zeit.
    timeout-minutes: 150
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests==2.34.2 tzdata==2026.5   # wie requirements.txt

      - name: Ranglisten berechnen
        env:
          GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python top50_agent.py
