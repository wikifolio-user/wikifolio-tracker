name: Watchlist Top 50 (täglich)

on:
  # GitHub startet geplante Laeufe oft STUNDEN spaeter als eingetragen (beobachtet: 05:30 UTC
  # -> 10-11 Uhr UTC). Deshalb mehrere Ausloeser, frueh in der Nacht - der erste rechnet,
  # die weiteren beenden sich sofort, wenn die Ranglisten von heute schon vorliegen
  # (NUR_WENN_ALT). Die Schlusskurse des Vortags liegen ab ca. 00 Uhr UTC vollstaendig vor.
  # 1) direkt im Anschluss an den Qualitaets-Agenten (teilen sich die Yahoo-Drossel)
  workflow_run:
    workflows: ["Watchlist Qualitäts-Score (täglich)"]
    types: [completed]
  # 2) Ersatz-Termine, falls der Qualitaets-Lauf ausfaellt oder sich verspaetet
  schedule:
    - cron: "40 1 * * *"
    - cron: "40 4 * * *"
  # Manuell startbar: Actions -> "Watchlist Top 50 (täglich)" -> Run workflow (rechnet immer)
  workflow_dispatch: {}

permissions:
  contents: write

# Nie gleichzeitig mit dem Qualitaets-Agenten (Yahoo-Drossel): ein neuer Lauf
# wartet, statt den laufenden abzubrechen. ACHTUNG: GitHub haelt je Gruppe nur
# EINEN wartenden Lauf - ein weiterer verdraengt ihn (Status "cancelled"), es
# kann also ein Lauf ausfallen; der naechste taegliche Lauf holt ihn nach.
concurrency:
  group: yahoo-abrufe
  cancel-in-progress: false

jobs:
  ranglisten:
    runs-on: ubuntu-latest
    # Großzügig bemessen: die wöchentliche wikifolio-Suche plus mehrere
    # tausend Kursabrufe mit bewusst gedrosselter Rate dauern ihre Zeit.
    timeout-minutes: 150
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests==2.34.2 tzdata==2026.5   # wie requirements.txt

      - name: Ranglisten berechnen
        env:
          GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUR_WENN_ALT: ${{ github.event_name != 'workflow_dispatch' && '1' || '' }}
        run: python top50_agent.py
